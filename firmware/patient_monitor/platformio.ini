; Patient Monitor firmware - ESP32-DevKitC
; Build with PlatformIO: `pio run` / `pio run -t upload`

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    oxullo/Arduino-MAX30100 @ ^1.2.1
build_flags =
    -D CORE_DEBUG_LEVEL=1
